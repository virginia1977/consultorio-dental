<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consultorio · Módulo Pacientes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F8F7;
    --surface: #FFFFFF;
    --surface-2: #EEF4F2;
    --ink: #12302C;
    --ink-soft: #3E5C58;
    --muted: #7C9490;
    --line: #DCE7E4;
    --primary: #0E6B62;
    --primary-dark: #094B45;
    --primary-tint: #E3F1EE;
    --accent: #5B63D6;
    --accent-tint: #ECEDFB;
    --green: #1FA35A;
    --green-tint: #E7F7EE;
    --yellow: #C9971C;
    --yellow-tint: #FBF3DD;
    --orange: #E06B22;
    --orange-tint: #FCE8DA;
    --red: #D5473F;
    --red-tint: #FBE6E4;
    --shadow: 0 1px 2px rgba(18,48,44,0.04), 0 8px 24px -12px rgba(18,48,44,0.15);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  #root{min-height:100vh;}

  /* ---------- layout ---------- */
  .app{display:flex; min-height:100vh;}
  .sync-bar{
    position:sticky; top:0; z-index:60; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:8px 16px; background:var(--primary-dark); color:#EAF4F2; font-size:12.5px;
  }
  .sync-bar .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .sync-bar button{
    background:rgba(255,255,255,0.12); border:none; color:#EAF4F2; font-size:12px; font-family:inherit;
    padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  .sidebar{
    width:236px; flex-shrink:0; background:var(--primary-dark); color:#EAF4F2;
    padding:26px 18px; display:flex; flex-direction:column; gap:26px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{flex-shrink:0;}
  .brand-text{font-family:'Fraunces',serif; font-size:19px; font-weight:600; line-height:1.15; letter-spacing:0.2px;}
  .brand-sub{font-size:10.5px; color:#9FC3BD; letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;}

  .nav{display:flex; flex-direction:column; gap:3px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    font-size:14px; color:#BFDAD5; cursor:pointer; transition:background .15s, color .15s;
    border:none; background:none; text-align:left; font-family:inherit;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:var(--primary); color:#fff; font-weight:600;}
  .nav-item.disabled{opacity:.45; cursor:not-allowed;}
  .nav-item.disabled:hover{background:none; color:#BFDAD5;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.7;}

  .nav-footer{margin-top:auto; font-size:11px; color:#6E948D; line-height:1.5;}

  .main{flex:1; padding:32px 40px; max-width:1400px;}
  .topline{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; gap:20px; flex-wrap:wrap;}
  .h1{font-family:'Fraunces',serif; font-size:28px; font-weight:600; margin:0 0 4px;}
  .h1-sub{color:var(--muted); font-size:14px; margin:0;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; border:none; border-radius:10px;
    padding:11px 18px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    transition:transform .1s, box-shadow .15s, background .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent); color:#fff; box-shadow:0 6px 16px -6px rgba(91,99,214,0.55);}
  .btn-primary:hover{background:#4A52C4;}
  .btn-ghost{background:var(--surface); color:var(--ink-soft); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger-text{background:none; color:var(--red); padding:6px 8px;}

  /* ---------- stat strip ---------- */
  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:26px;}
  .stats.stats-4{grid-template-columns:repeat(4,1fr);}
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .stat-num{font-family:'Fraunces',serif; font-size:26px; font-weight:600; line-height:1;}
  .stat-label{font-size:12px; color:var(--muted); margin-top:6px; display:flex; align-items:center; gap:6px;}
  .stat-card.total .stat-num{color:var(--ink);}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .search-wrap{position:relative; flex:1; min-width:220px;}
  .search-wrap input{
    width:100%; padding:11px 14px 11px 38px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); font-family:inherit; font-size:14px; color:var(--ink);
  }
  .search-wrap input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .search-icon{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted);}
  select.filter{
    padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
    font-family:inherit; font-size:14px; color:var(--ink-soft); cursor:pointer;
  }

  /* ---------- table ---------- */
  .table-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; min-width:760px; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; padding:13px 16px; font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--muted); border-bottom:1px solid var(--line); font-weight:600; background:var(--surface-2);
  }
  tbody td{padding:13px 16px; border-bottom:1px solid var(--line); color:var(--ink-soft); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFCFB;}
  .pid{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--primary); font-weight:600; background:var(--primary-tint); padding:3px 8px; border-radius:6px; letter-spacing:0.02em;}
  .pname{font-weight:600; color:var(--ink);}
  .psub{font-size:12px; color:var(--muted);}

  .badge{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:20px; font-size:12px; font-weight:600;}
  .dot{width:7px;height:7px;border-radius:50%; flex-shrink:0;}
  .badge.b-green{background:var(--green-tint); color:var(--green);}
  .badge.b-yellow{background:var(--yellow-tint); color:var(--yellow);}
  .badge.b-orange{background:var(--orange-tint); color:var(--orange);}
  .badge.b-red{background:var(--red-tint); color:var(--red);}
  .dot.d-green{background:var(--green);} .dot.d-yellow{background:var(--yellow);}
  .dot.d-orange{background:var(--orange);} .dot.d-red{background:var(--red);}

  .row-actions{display:flex; gap:4px; justify-content:flex-end;}
  .icon-btn{background:none; border:none; cursor:pointer; padding:7px; border-radius:8px; color:var(--muted); display:flex;}
  .icon-btn:hover{background:var(--surface-2); color:var(--ink);}

  .empty-state{padding:70px 20px; text-align:center; color:var(--muted);}
  .empty-state .tooth{margin-bottom:14px;}
  .empty-state h3{font-family:'Fraunces',serif; color:var(--ink); font-size:18px; margin:0 0 6px;}
  .empty-state p{font-size:13.5px; margin:0 0 18px;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(18,48,44,0.35); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:36px 16px; z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border-radius:18px; width:100%; max-width:720px; box-shadow:0 24px 60px -20px rgba(18,48,44,0.4);
    animation:pop .16s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(.99);} to{opacity:1; transform:none;}}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:22px 26px; border-bottom:1px solid var(--line);}
  .modal-head h2{font-family:'Fraunces',serif; font-size:20px; margin:0; font-weight:600;}
  .modal-close{background:none; border:none; cursor:pointer; color:var(--muted); padding:6px; border-radius:8px;}
  .modal-close:hover{background:var(--surface-2); color:var(--ink);}
  .modal-body{padding:24px 26px; max-height:70vh; overflow-y:auto;}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:18px 26px; border-top:1px solid var(--line);}

  .section-label{font-size:11.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--primary); font-weight:700; margin:22px 0 12px;}
  .section-label:first-child{margin-top:0;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; color:var(--ink-soft); font-weight:600;}
  .field input, .field select{
    padding:10px 12px; border-radius:9px; border:1px solid var(--line); font-family:inherit;
    font-size:13.5px; color:var(--ink); background:#fff;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field.readonly input{background:var(--surface-2); color:var(--muted);}
  .field .hint{font-size:11px; color:var(--muted);}
  .status-picker{display:flex; gap:8px; flex-wrap:wrap;}
  .status-opt{
    display:flex; align-items:center; gap:7px; padding:9px 13px; border-radius:10px; border:1.5px solid var(--line);
    cursor:pointer; font-size:13px; color:var(--ink-soft); background:#fff; font-weight:600;
  }
  .status-opt.selected{border-color:currentColor;}
  .status-opt.selected.s-green{color:var(--green); background:var(--green-tint);}
  .status-opt.selected.s-yellow{color:var(--yellow); background:var(--yellow-tint);}
  .status-opt.selected.s-orange{color:var(--orange); background:var(--orange-tint);}
  .status-opt.selected.s-red{color:var(--red); background:var(--red-tint);}

  .prof-list{display:flex; flex-direction:column; gap:8px;}
  .prof-row{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; box-shadow:var(--shadow);
  }
  .prof-avatar{
    width:38px; height:38px; border-radius:50%; background:var(--accent-tint); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Fraunces',serif; font-size:15px; flex-shrink:0;
  }
  .prof-name{font-weight:600; color:var(--ink); font-size:14px;}
  .prof-spec{font-size:12.5px; color:var(--muted);}

  .coming-soon{
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:100px 20px;
    color:var(--muted); text-align:center; gap:10px;
  }
  .coming-soon h3{font-family:'Fraunces',serif; color:var(--ink); font-size:20px; margin:0;}

  /* ---------- ficha clínica ---------- */
  .ficha-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  @media(max-width:700px){.ficha-grid{grid-template-columns:1fr;}}
  .ficha-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .ficha-card h3{font-family:'Fraunces',serif; font-size:16px; margin:0 0 14px; color:var(--ink);}
  .atencion-row{display:flex; flex-direction:column; gap:4px; padding:12px 0; border-bottom:1px solid var(--line);}
  .atencion-row:last-child{border-bottom:none;}
  .atencion-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .atencion-desc{font-size:13.5px; color:var(--ink); font-weight:600;}
  .atencion-meta{font-size:12px; color:var(--muted);}
  .atencion-facturar{font-size:11.5px; color:var(--accent); font-weight:700; background:var(--accent-tint); padding:3px 8px; border-radius:6px; border:none; cursor:pointer;}

  /* odontograma */
  .odontograma{display:flex; flex-direction:column; gap:14px;}
  .odonto-row{display:flex; gap:8px; flex-wrap:wrap;}
  .odonto-quad{font-size:10px; color:var(--muted); text-align:center; font-weight:600; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;}

  .odonto-paleta{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .odonto-tool{display:flex; align-items:center; gap:6px; font-size:11.5px; padding:6px 10px; border-radius:20px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink-soft); font-family:inherit;}
  .odonto-tool:hover{border-color:var(--accent);}
  .odonto-tool.active{border-color:var(--primary); background:var(--primary-tint); color:var(--primary); font-weight:700;}
  .odonto-tool-swatch{width:12px; height:12px; border-radius:50%; flex-shrink:0; border:2px dashed var(--muted); box-sizing:border-box;}

  .diente-box{display:flex; flex-direction:column; align-items:center; gap:3px;}
  .diente-caras{
    display:grid; width:38px; height:38px;
    grid-template-columns:1fr 1.3fr 1fr; grid-template-rows:1fr 1.3fr 1fr;
    grid-template-areas:". t ." "l c r" ". b .";
    border:1px solid var(--line); border-radius:7px; overflow:hidden; background:var(--surface-2);
  }
  .cara{cursor:pointer; background:transparent;}
  .cara:hover{outline:2px solid var(--accent); outline-offset:-2px; position:relative; z-index:1;}
  .cara-t{grid-area:t;} .cara-l{grid-area:l;} .cara-c{grid-area:c; border:1px solid var(--line);} .cara-r{grid-area:r;} .cara-b{grid-area:b;}
  .diente-whole{
    width:38px; height:38px; border-radius:7px; border:1px solid; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; font-weight:700;
  }
  .diente-num{font-size:10px; color:var(--muted); font-weight:600;}

  /* firma digital */
  .firma-canvas{
    border:1.5px solid var(--line); border-radius:10px; background:#fff;
    width:100%; height:160px; touch-action:none; cursor:crosshair; display:block;
  }
  .firma-canvas.firmado{border-color:var(--green);}
  .firma-img{width:100%; height:160px; object-fit:contain; border:1.5px solid var(--green); border-radius:10px; background:#fff;}
  .firma-meta{font-size:11.5px; color:var(--green); margin-top:6px; font-weight:600;}

  /* ---------- obras sociales / nomenclador ---------- */
  .os-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:12px;}
  .os-card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:16px;
    cursor:pointer; transition:border-color .15s, box-shadow .15s; box-shadow:var(--shadow);
  }
  .os-card:hover{border-color:var(--accent);}
  .os-card.selected{border-color:var(--accent); background:var(--accent-tint);}
  .os-card-name{font-weight:700; color:var(--ink); font-size:14.5px; margin-bottom:4px;}
  .os-card-count{font-size:12px; color:var(--muted);}
  .os-card-del{float:right; background:none; border:none; color:var(--muted); cursor:pointer; padding:2px;}
  .os-card-del:hover{color:var(--red);}

  .code-chip{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-tint); padding:3px 8px; border-radius:6px;}
  .import-box{
    background:var(--surface-2); border:1.5px dashed var(--line); border-radius:12px; padding:16px; margin-bottom:16px;
    transition:background .15s, border-color .15s;
  }
  .import-box.dragging{background:var(--accent-tint); border-color:var(--accent);}
  .import-box textarea{
    width:100%; min-height:90px; border-radius:9px; border:1px solid var(--line); padding:10px 12px;
    font-family:'JetBrains Mono',monospace; font-size:12px; resize:vertical; margin-top:8px;
  }
  .import-box .hint{font-size:12px; color:var(--muted); line-height:1.5;}

  .tooth-picker{display:flex; flex-direction:column; gap:8px;}
  .tooth-row{display:flex; gap:5px; flex-wrap:wrap;}
  .tooth-btn{
    width:34px; height:34px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; color:var(--ink-soft);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .tooth-btn:hover{border-color:var(--accent);}
  .tooth-btn.selected{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tooth-quad-label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; width:38px; display:flex; align-items:center;}

  .cara-picker{display:flex; gap:8px;}
  .cara-btn{
    width:44px; height:44px; border-radius:10px; border:1.5px solid var(--line); background:#fff;
    font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .cara-btn.selected{background:var(--primary); border-color:var(--primary); color:#fff;}
  .cara-btn:disabled{opacity:.35; cursor:not-allowed;}
  .pieza-cara-tag{font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; color:var(--primary); background:var(--primary-tint); padding:3px 7px; border-radius:6px;}

  /* ---------- liquidaciones ---------- */
  .liqui-panel{display:grid; grid-template-columns:1fr 340px; gap:20px; align-items:start;}
  @media (max-width: 1100px){ .liqui-panel{grid-template-columns:1fr;} }
  .liqui-form{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px;}
  .liqui-receipt{
    background:var(--primary-dark); color:#EAF4F2; border-radius:var(--radius); padding:22px;
    box-shadow:0 16px 40px -18px rgba(9,75,69,0.55); position:sticky; top:20px;
  }
  .liqui-receipt-name{font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin-bottom:2px;}
  .liqui-receipt-period{font-size:12px; color:#9FC3BD; margin-bottom:16px;}
  .liqui-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed rgba(234,244,242,0.15); font-size:13.5px;}
  .liqui-row.neg{color:#F5B8AE;}
  .liqui-row.pos{color:#A9E4C4;}
  .liqui-row-label{color:#BFDAD5;}
  .liqui-total{
    display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; padding-top:14px;
    border-top:2px solid rgba(234,244,242,0.3);
  }
  .liqui-total-label{font-size:13px; color:#BFDAD5; font-weight:600;}
  .liqui-total-num{font-family:'Fraunces',serif; font-size:26px; font-weight:700; color:#fff;}
  .liqui-history-row td{vertical-align:middle;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:#fff; padding:12px 20px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); z-index:100;
    display:flex; align-items:center; gap:8px; animation:toastIn .2s ease;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:#D3E1DE; border-radius:6px;}

  @media (max-width: 880px){
    .app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; align-items:center; padding:14px 18px; gap:16px;}
    .brand-sub{display:none;}
    .nav{flex-direction:row; overflow-x:auto;}
    .nav-footer{display:none;}
    .main{padding:20px;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .grid2, .grid3{grid-template-columns:1fr;}
    .table-wrap{position:relative;}
    .table-wrap:has(table)::after{
      content:'⇠ Deslizá para ver más (editar, ficha clínica) ⇢';
      display:block; text-align:center; font-size:11px; color:var(--muted);
      padding:8px; background:var(--surface-2); border-top:1px solid var(--line);
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useMemo, useRef } = React;

// --- Conexión a Firebase (compartida entre las 3 odontólogas) ---

// Reemplaza a storage: misma forma (get/set/delete/list), pero guarda en Firestore
// para que las 3 lo vean en tiempo real en vez de guardar solo en este celular.
const storage = {
  async get(key, shared){
    if(!fsdb) throw new Error('Firebase no disponible');
    const doc = await fsdb.collection('datos').doc(key).get();
    if(!doc.exists) throw new Error('not found');
    return {key, value: doc.data().value, shared: !!shared};
  },
  async set(key, value, shared){
    if(!fsdb) throw new Error('Firebase no disponible');
    await fsdb.collection('datos').doc(key).set({value, actualizadoEl: Date.now()});
    return {key, value, shared: !!shared};
  },
  async delete(key, shared){
    if(!fsdb) throw new Error('Firebase no disponible');
    await fsdb.collection('datos').doc(key).delete();
    return {key, deleted:true, shared: !!shared};
  },
  async list(prefix, shared){
    if(!fsdb) throw new Error('Firebase no disponible');
    const snap = await fsdb.collection('datos').get();
    let keys = snap.docs.map(d=>d.id);
    if(prefix) keys = keys.filter(k=>k.startsWith(prefix));
    return {keys, prefix, shared: !!shared};
  }
};

// Parsea texto pegado desde Excel (separado por tabs o comas): codigo, descripcion, valor
function parseNomencladorPaste(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.includes('\t') ? line.split('\t') : line.split(',');
    const codigo = (parts[0]||'').trim();
    const descripcion = (parts[1]||'').trim();
    const valorRaw = (parts[2]||'0').replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.');
    const valor = parseFloat(valorRaw) || 0;
    return {codigo, descripcion, valor};
  }).filter(r=>r.codigo);
}

function calcAge(dob){
  if(!dob) return '';
  const b = new Date(dob), t = new Date();
  let age = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && t.getDate() < b.getDate())) age--;
  return isNaN(age) ? '' : age;
}

  function readDroppedFile(file){
    if(!file){ return; }
    if(!/\.(txt|csv|tsv)$/i.test(file.name)){
      setToast('Ese archivo no se puede leer directo (usá .txt o .csv). Abrilo y pegá el contenido en el cuadro.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = String(ev.target.result || '')
        .split('\n')
        .filter(l => !l.trim().startsWith('#'))
        .join('\n')
        .trim();
      setPasteText(text);
      setToast('Archivo "' + file.name + '" cargado — revisá y tocá "Importar planilla".');
    };
    reader.onerror = () => setToast('No se pudo leer el archivo.');
    reader.readAsText(file, 'utf-8');
  }

  async function aplicarOdonto(pacId, pieza, cara){
    const tool = TRATAMIENTOS_ODONTO.find(t=>t.key===odontoTool) || TRATAMIENTOS_ODONTO[0];
    const f = getFicha(pacId);
    const raw = f.odontograma ? f.odontograma[pieza] : null;
    const odActual = (raw && typeof raw==='object') ? raw : {estado:null, caras:{}};
    let nuevo;
    if(tool.key==='sano'){
      nuevo = {estado:null, caras:{}};
    } else if(tool.tipo==='diente'){
      nuevo = {estado: odActual.estado===tool.key ? null : tool.key, caras: odActual.caras||{}};
    } else if(cara){
      const caras = {...(odActual.caras||{})};
      if(caras[cara]===tool.key){ delete caras[cara]; } else { caras[cara]=tool.key; }
      nuevo = {...odActual, caras};
    } else {
      return; // clic en pieza con estado general usando herramienta de cara: no hace nada
    }
    const od = {...(f.odontograma||{}), [pieza]: nuevo};
    await saveFichasClinicas({...fichasClinicas, [pacId]: {...f, odontograma:od}});
  }

  function initCanvas(){
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#12302C'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let drawing = false;
    function pos(e){ const r=canvas.getBoundingClientRect(); const src=e.touches?e.touches[0]:e; return {x:(src.clientX-r.left)*(canvas.width/r.width), y:(src.clientY-r.top)*(canvas.height/r.height)}; }
    canvas.onmousedown = canvas.ontouchstart = e=>{ e.preventDefault(); drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
    canvas.onmousemove = canvas.ontouchmove = e=>{ e.preventDefault(); if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
    canvas.onmouseup = canvas.ontouchend = ()=>{ drawing=false; };
  }

    const fichasMes = new Set(); // paciente + obraSocial + año-mes
    liquiPrestaciones.forEach(p=>{
      const os = Number(p.obraSocial)||0;
      const part = Number(p.particular)||0;
      const plus = Number(p.plus)||0;
      const osInfo = obrasSociales.find(o=>o.id===p.obraSocialId);
      const pctAOA = osInfo ? (Number(osInfo.porcentajeAOA)||0) : 0;
      const baseFacturadaAOA = os + part; // el Plus no pasa por la obra social / AOA
      const descuento = baseFacturadaAOA * pctAOA/100;
      s.obraSocialBruto += os;
      s.particular += part;
      s.plus += plus;
      s.aoaDescuento += descuento;
      s.totalBruto += os + part + plus;
      s.totalNeto += (os + part - descuento) + plus;
      if(p.obraSocialId && p.fecha){

                React.createElement('label', null, 'Plus'),
                React.createElement('input', {type:'number', min:'0', value:formAtencion.montoPlus, onChange:e=>setFormAtencion({...formAtencion, montoPlus:e.target.value})})
              ),
            ),
            React.createElement('div', {className:'field', style:{marginTop:'14px'}},
              React.createElement('label', null, 'Notas de la consulta'),
              React.createElement('textarea', {
                value:formAtencion.notas, onChange:e=>setFormAtencion({...formAtencion, notas:e.target.value}),
                placeholder:'Observaciones de esta consulta puntual...',
                style:{width:'100%', minHeight:'70px', border:'1px solid var(--line)', borderRadius:'9px', padding:'10px 12px', fontFamily:'inherit', fontSize:'13.5px'}
              })
            )
          ),
          React.createElement('div', {className:'modal-foot'},
            React.createElement('button', {type:'button', className:'btn btn-ghost', onClick:()=>setShowAtencionForm(false)}, 'Cancelar'),
            React.createElement('button', {type:'submit', className:'btn btn-primary'}, editingAtencion ? 'Guardar cambios' : 'Registrar atención')
          )
        )
      )
    ),

    // Modal Consentimiento Informado con Firma Digital
    showConsentimiento && fichaActualPacId && React.createElement('div', {className:'overlay', onClick:e=>{ if(e.target.className==='overlay') setShowConsentimiento(false); }},
      React.createElement('div', {className:'modal', style:{maxWidth:'640px'}},
        React.createElement('div', {className:'modal-head'},
          React.createElement('h2', null, '✍️ Consentimiento informado'),
          React.createElement('button', {className:'modal-close', onClick:()=>setShowConsentimiento(false)}, ICONS.close)
        ),
        React.createElement('div', {className:'modal-body'},
          React.createElement('div', {style:{background:'var(--surface-2)', border:'1px solid var(--line)', borderRadius:'10px', padding:'14px 16px', marginBottom:'18px', fontSize:'13px', lineHeight:'1.7', whiteSpace:'pre-wrap', maxHeight:'260px', overflowY:'auto', color:'var(--ink-soft)'}},
            TEXTO_CONSENTIMIENTO
          ),
          React.createElement('div', {className:'section-label', style:{marginTop:'0'}}, 'Firma del paciente'),
          React.createElement('p', {style:{fontSize:'12.5px', color:'var(--muted)', marginBottom:'8px'}}, 'El paciente firma con el dedo en el recuadro de abajo:'),
          React.createElement('canvas', {
            ref:canvasRef, className:'firma-canvas', width:560, height:160,
          }),
          React.createElement('div', {style:{display:'flex', gap:'10px', marginTop:'10px'}},
            React.createElement('button', {type:'button', className:'btn btn-ghost', onClick:limpiarFirma}, '🗑 Limpiar firma'),
          )
        ),
        React.createElement('div', {className:'modal-foot'},
          React.createElement('button', {type:'button', className:'btn btn-ghost', onClick:()=>setShowConsentimiento(false)}, 'Cancelar'),
          React.createElement('button', {type:'button', className:'btn btn-primary', onClick:()=>guardarFirma(fichaActualPacId)}, '💾 Guardar consentimiento firmado')
        )
      )
    ),

    // Modal Derivación
    showDerivForm && React.createElement('div', {className:'overlay', onClick:e=>{ if(e.target.className==='overlay') setShowDerivForm(false); }},
      React.createElement('div', {className:'modal', style:{maxWidth:'600px'}},
        React.createElement('div', {className:'modal-head'},
          React.createElement('h2', null, editingDeriv ? 'Editar derivación' : 'Nueva derivación'),
          React.createElement('button', {className:'modal-close', onClick:()=>setShowDerivForm(false)}, ICONS.close)
        ),
        React.createElement('form', {onSubmit:submitDerivacion},
          React.createElement('div', {className:'modal-body'},
            React.createElement('div', {className:'grid2'},
              React.createElement('div', {className:'field readonly'},
                React.createElement('label', null, 'N°'),
                React.createElement('input', {value:formDeriv.id, disabled:true})
              ),
              React.createElement('div', {className:'field'},
                React.createElement('label', null, 'Fecha'),
                React.createElement('input', {type:'date', value:formDeriv.fecha, onChange:e=>setFormDeriv({...formDeriv, fecha:e.target.value})})
              ),
              React.createElement('div', {className:'field'},
                React.createElement('label', null, 'Paciente *'),
                React.createElement('select', {value:formDeriv.pacienteId, onChange:e=>setFormDeriv({...formDeriv, pacienteId:e.target.value, presupuestoId:''}), required:true},
                  React.createElement('option', {value:''}, 'Seleccionar...'),
                  pacientes.map(p => React.createElement('option', {key:p.id, value:p.id}, p.apellido + ', ' + p.nombre + ' (' + p.id + ')'))
                )
              ),
              React.createElement('div', {className:'field'},
                React.createElement('label', null, 'Presupuesto relacionado'),
                React.createElement('select', {value:formDeriv.presupuestoId, onChange:e=>setFormDeriv({...formDeriv, presupuestoId:e.target.value})},
                  React.createElement('option', {value:''}, 'Sin presupuesto vinculado'),
                  presupuestos.filter(p=>p.pacienteId===formDeriv.pacienteId).map(p => React.createElement('option', {key:p.id, value:p.id}, p.id + ' — ' + money(p.montoTotal)))
                )
              ),
            ),
            React.createElement('div', {className:'grid2', style:{marginTop:'14px'}},
              React.createElement('div', {className:'field'},
                React.createElement('label', null, 'Quién deriva *'),
                React.createElement('input', {value:formDeriv.quienDeriva, onChange:e=>setFormDeriv({...formDeriv, quienDeriva:e.target.value}), placeholder:'Profesional o colega que deriva', required:true, list:'lista-profesionales'}),
                React.createElement('datalist', {id:'lista-profesionales'}, profesionales.map(pr=>React.createElement('option',{key:pr.id, value:pr.nombre})))
              ),
              React.createElement('div', {className:'field'},
                React.createElement('label', null, 'Quién recibe *'),
                React.createElement('select', {value:formDeriv.quienRecibe, onChange:e=>setFormDeriv({...formDeriv, quienRecibe:e.target.value}), required:true},
                  React.createElement('option', {value:''}, 'Seleccionar...'),
                  profesionales.map(pr => React.createElement('option', {key:pr.id, value:pr.nombre}, pr.nombre))
                )
              ),
            ),
            React.createElement('div', {className:'field', style:{marginTop:'14px'}},
              React.createElement('label', null, 'Motivo'),
              React.createElement('input', {value:formDeriv.motivo, onChange:e=>setFormDeriv({...formDeriv, motivo:e.target.value}), placeholder:'Ej: requiere ortodoncia previa'})
            ),
            React.createElement('div', {className:'grid2', style:{marginTop:'14px'}},
              React.createElement('div', {className:'field'},
                React.createElement('label', null, '% Comisión'),
                React.createElement('input', {type:'number', min:'0', max:'100', value:formDeriv.porcentaje, onChange:e=>setFormDeriv({...formDeriv, porcentaje:e.target.value})})
              ),
              React.createElement('div', {className:'field readonly'},
                React.createElement('label', null, 'Comisión calculada'),
                React.createElement('input', {value: money(comisionMontoDe(formDeriv)), disabled:true})
              ),
            ),
            React.createElement('div', {className:'section-label'}, 'Estado de la comisión'),
            React.createElement('div', {className:'status-picker'},
              ESTADOS_COMISION.map(e => React.createElement('div', {
                key:e.value,
                className:'status-opt' + (formDeriv.comisionPagada===e.value ? ' selected s-'+e.color : ''),
                onClick:()=>setFormDeriv({...formDeriv, comisionPagada:e.value})
              }, React.createElement('span',{className:'dot d-'+e.color}), e.label))
            )
          ),
          React.createElement('div', {className:'modal-foot'},
            React.createElement('button', {type:'button', className:'btn btn-ghost', onClick:()=>setShowDerivForm(false)}, 'Cancelar'),
            React.createElement('button', {type:'submit', className:'btn btn-primary'}, editingDeriv ? 'Guardar cambios' : 'Registrar derivación')
          )
        )
      )
    ),

    toast && React.createElement(Toast, {msg:toast, onDone:()=>setToast(null)})
  )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
